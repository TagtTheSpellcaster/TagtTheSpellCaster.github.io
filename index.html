<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TagtTheSpellCaster — GitHub Pages</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        background: #f5f5f5;
        color: #222;
        font-family: Arial, sans-serif;
    }

    main {
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 600;
    }

    .subtitle {
        margin: 0 0 30px;
        color: #666;
        font-size: 14px;
    }

    #status {
        color: #666;
        font-size: 14px;
        margin-bottom: 15px;
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    li {
        background: white;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-bottom: 10px;
        padding: 14px 16px;
    }

    li a {
        color: #222;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
    }

    li a:hover {
        text-decoration: underline;
    }

    .description {
        margin-top: 5px;
        color: #777;
        font-size: 13px;
    }

    .error {
        color: #a00;
    }
</style>
</head>

<body>

<main>
    <h1>Tagt The Spellcaster – GitHub Pages</h1>

    <p class="subtitle">
        Progetti e strumenti pubblicati su GitHub Pages
    </p>

    <div id="status">Ricerca dei progetti...</div>

    <ul id="projects"></ul>
</main>

<script>

async function loadProjects() {

    const status = document.getElementById("status");
    const list = document.getElementById("projects");

    try {

        const response = await fetch("repositories.json");

        if (!response.ok) {
            throw new Error(
                `repositories.json: HTTP ${response.status}`
            );
        }

        const data = await response.json();

        const projects = data.projects || [];


        if (projects.length === 0) {

            status.textContent =
                "Nessun progetto GitHub Pages trovato.";

            return;
        }


        status.textContent =
            `${projects.length} progetti pubblicati`;


        for (const project of projects) {

            const li = document.createElement("li");

            const link = document.createElement("a");

            link.href = project.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            link.textContent = project.name;

            li.appendChild(link);


            if (project.description) {

                const description =
                    document.createElement("div");

                description.className =
                    "description";

                description.textContent =
                    project.description;

                li.appendChild(description);
            }


            list.appendChild(li);
        }


    } catch (error) {

        status.textContent =
            "Impossibile recuperare l'elenco dei progetti.";

        status.className = "error";

        console.error(error);
    }
}


loadProjects();

</script>

</body>
</html>
