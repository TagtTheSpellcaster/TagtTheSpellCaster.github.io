<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TagtTheSpellCaster — GitHub Pages</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        background: #f5f5f5;
        color: #222;
        font-family: Arial, sans-serif;
    }

    main {
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 600;
    }

    .subtitle {
        margin: 0 0 30px;
        color: #666;
        font-size: 14px;
    }

    #status {
        color: #666;
        font-size: 14px;
        margin-bottom: 15px;
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    li {
        background: white;
        border: 1px solid #ddd;
        border-radius: 5px;
        margin-bottom: 10px;
        padding: 14px 16px;
    }

    li a {
        color: #222;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
    }

    li a:hover {
        text-decoration: underline;
    }

    .description {
        margin-top: 5px;
        color: #777;
        font-size: 13px;
    }

    .error {
        color: #a00;
    }
</style>
</head>

<body>

<main>
    <h1>GitHub Pages</h1>

    <p class="subtitle">
        Progetti e strumenti pubblicati su GitHub Pages
    </p>

    <div id="status">Ricerca dei progetti...</div>

    <ul id="projects"></ul>
</main>

<script>

const USERNAME = "TagtTheSpellCaster";

async function getRepositories() {

    const repositories = [];

    let page = 1;

    while (true) {

        const response = await fetch(
            `https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}&type=public`
        );

        if (!response.ok) {
            throw new Error(
                `GitHub API: HTTP ${response.status}`
            );
        }

        const data = await response.json();

        if (data.length === 0) {
            break;
        }

        repositories.push(...data);

        if (data.length < 100) {
            break;
        }

        page++;
    }

    return repositories;
}


async function hasGitHubPages(repository) {

    const url =
        `https://api.github.com/repos/${USERNAME}/${repository.name}/pages`;

    try {

        const response = await fetch(url);

        if (!response.ok) {
            return null;
        }

        const data = await response.json();

        return data.html_url || null;

    } catch (error) {

        return null;
    }
}


async function loadProjects() {

    const status = document.getElementById("status");
    const list = document.getElementById("projects");

    try {

        const repositories = await getRepositories();

        /*
         * Controlliamo i repository in parallelo.
         */
        const results = await Promise.all(

            repositories.map(async repository => {

                const pagesUrl =
                    await hasGitHubPages(repository);

                return {
                    repository,
                    pagesUrl
                };

            })

        );

        const projects = results
            .filter(item => item.pagesUrl)
            .sort((a, b) =>
                a.repository.name.localeCompare(
                    b.repository.name,
                    "it"
                )
            );


        if (projects.length === 0) {

            status.textContent =
                "Nessun progetto GitHub Pages trovato.";

            return;
        }


        status.textContent =
            `${projects.length} progetti pubblicati`;


        for (const project of projects) {

            const li = document.createElement("li");

            const link = document.createElement("a");

            link.href = project.pagesUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            link.textContent =
                project.repository.name;


            li.appendChild(link);


            if (project.repository.description) {

                const description =
                    document.createElement("div");

                description.className =
                    "description";

                description.textContent =
                    project.repository.description;

                li.appendChild(description);
            }


            list.appendChild(li);
        }


    } catch (error) {

        status.textContent =
            "Impossibile recuperare i dati da GitHub.";

        status.className = "error";

        console.error(error);
    }
}


loadProjects();

</script>

</body>
</html>
