<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TagtTheSpellCaster — GitHub Pages</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 56px 20px;
        background: #f1f5f2;
        color: #26332c;
        font-family: Arial, sans-serif;
    }

    main {
        max-width: 760px;
        margin: 0 auto;
    }

    h1 {
        margin: 0;
        color: #234b36;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.4px;
    }

    h1::after {
        content: "";
        display: block;
        width: 42px;
        height: 3px;
        margin-top: 12px;
        background: #6f9b7d;
        border-radius: 3px;
    }

    .subtitle {
        margin: 16px 0 32px;
        color: #68766d;
        font-size: 14px;
        line-height: 1.5;
    }

    #status {
        margin-bottom: 14px;
        color: #718078;
        font-size: 13px;
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    li {
        position: relative;
        margin-bottom: 12px;
        padding: 17px 48px 17px 18px;
        background: #ffffff;
        border: 1px solid #dce5df;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(35, 75, 54, 0.04);
        transition:
            border-color 0.15s ease,
            box-shadow 0.15s ease,
            transform 0.15s ease;
    }

    li::after {
        content: "↗";
        position: absolute;
        top: 50%;
        right: 18px;
        color: #9aaba0;
        font-size: 16px;
        transform: translateY(-50%);
        transition:
            color 0.15s ease,
            transform 0.15s ease;
    }

    li:hover {
        border-color: #b9cdbf;
        box-shadow: 0 4px 14px rgba(35, 75, 54, 0.08);
        transform: translateY(-1px);
    }

    li:hover::after {
        color: #3f7655;
        transform: translate(2px, -50%);
    }

    li a {
        color: #2f6245;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
    }

    li a:hover {
        color: #234b36;
    }

    .description {
        margin-top: 6px;
        color: #718078;
        font-size: 13px;
        line-height: 1.45;
    }

    .error {
        color: #a04b4b;
    }

    @media (max-width: 600px) {
        body {
            padding: 36px 16px;
        }

        h1 {
            font-size: 27px;
        }

        li {
            padding: 15px 42px 15px 16px;
        }
    }
</style>
</head>

<body>

<main>
    <h1>Tagt The Spellcaster – GitHub Pages</h1>

    <p class="subtitle">
        Progetti e strumenti pubblicati su GitHub Pages
    </p>

    <div id="status">Ricerca dei progetti...</div>

    <ul id="projects"></ul>
</main>

<script>

async function loadProjects() {

    const status = document.getElementById("status");
    const list = document.getElementById("projects");

    try {

        const response = await fetch("repositories.json");

        if (!response.ok) {
            throw new Error(
                `repositories.json: HTTP ${response.status}`
            );
        }

        const data = await response.json();

        const projects = data.projects || [];


        if (projects.length === 0) {

            status.textContent =
                "Nessun progetto GitHub Pages trovato.";

            return;
        }


        status.textContent =
            `${projects.length} progetti pubblicati`;


        for (const project of projects) {

            const li = document.createElement("li");

            const link = document.createElement("a");

            link.href = project.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            link.textContent = project.name;

            li.appendChild(link);


            if (project.description) {

                const description =
                    document.createElement("div");

                description.className =
                    "description";

                description.textContent =
                    project.description;

                li.appendChild(description);
            }


            list.appendChild(li);
        }


    } catch (error) {

        status.textContent =
            "Impossibile recuperare l'elenco dei progetti.";

        status.className = "error";

        console.error(error);
    }
}


loadProjects();

</script>

</body>
</html>
