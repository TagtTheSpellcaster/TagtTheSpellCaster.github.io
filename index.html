<!DOCTYPE html>
<html lang="it" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagt The Spellcaster — GitHub Pages</title>

<!-- Font Google: Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    /* 1. TEMA CHIARO (Default) */
    :root {
        --bg: #f4f7f5;
        --surface: #ffffff;
        --surface-border: #e0e8e2;
        --text: #1b2620;
        --text-muted: #627267;
        --primary: #234b36;
        --primary-light: #3e6b50;
        --accent-bg: #eaf1ed;
        --card-hover-border: #a4beac;
        --card-shadow: 0 2px 10px rgba(35, 75, 54, 0.03);
        --card-shadow-hover: 0 8px 24px rgba(35, 75, 54, 0.08);
    }

    /* 2. TEMA SCURO DI SISTEMA */
    @media (prefers-color-scheme: dark) {
        :root[data-theme="system"] {
            --bg: #111613;
            --surface: #18201b;
            --surface-border: #26332a;
            --text: #e2e8e4;
            --text-muted: #84968a;
            --primary: #7ebd93;
            --primary-light: #9ed1af;
            --accent-bg: #202c24;
            --card-hover-border: #3d5946;
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            --card-shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
    }

    /* 3. TEMA SCURO FORZATO */
    :root[data-theme="dark"] {
        --bg: #111613;
        --surface: #18201b;
        --surface-border: #26332a;
        --text: #e2e8e4;
        --text-muted: #84968a;
        --primary: #7ebd93;
        --primary-light: #9ed1af;
        --accent-bg: #202c24;
        --card-hover-border: #3d5946;
        --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        --card-shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* 4. TEMA CHIARO FORZATO */
    :root[data-theme="light"] {
        --bg: #f4f7f5;
        --surface: #ffffff;
        --surface-border: #e0e8e2;
        --text: #1b2620;
        --text-muted: #627267;
        --primary: #234b36;
        --primary-light: #3e6b50;
        --accent-bg: #eaf1ed;
        --card-hover-border: #a4beac;
        --card-shadow: 0 2px 10px rgba(35, 75, 54, 0.03);
        --card-shadow-hover: 0 8px 24px rgba(35, 75, 54, 0.08);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 64px 24px 96px;
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        transition: background-color 0.2s ease, color 0.2s ease;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
    }

    main {
        max-width: 720px;
        margin: 0 auto;
    }

    header {
        margin-bottom: 40px;
    }

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
    }

    h1 {
        margin: 0;
        color: var(--primary);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.8px;
        line-height: 1.25;
    }

    h1::after {
        content: "";
        display: block;
        width: 36px;
        height: 3px;
        margin-top: 16px;
        background: var(--primary-light);
        border-radius: 2px;
        opacity: 0.8;
    }

    .theme-selector {
        display: inline-flex;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 6px;
        padding: 3px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.1px;
        box-shadow: var(--card-shadow);
    }

    .theme-option {
        padding: 4px 10px;
        cursor: pointer;
        color: var(--text-muted);
        border-radius: 4px;
        transition: color 0.15s ease, background 0.15s ease;
        user-select: none;
    }

    .theme-option:hover {
        color: var(--text);
    }

    .theme-option.active {
        background: var(--accent-bg);
        color: var(--primary);
    }

    .theme-separator {
        color: var(--surface-border);
        font-weight: 300;
        padding: 0 1px;
    }

    .subtitle {
        margin: 18px 0 0;
        color: var(--text-muted);
        font-size: 15px;
        font-weight: 400;
        letter-spacing: -0.1px;
    }

    .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    #status {
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.2px;
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 14px;
    }

    li {
        position: relative;
        padding: 20px 48px 20px 22px;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 10px;
        box-shadow: var(--card-shadow);
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
    }

    li::after {
        content: "↗";
        position: absolute;
        top: 22px;
        right: 22px;
        color: var(--text-muted);
        font-size: 16px;
        line-height: 1;
        transition: color 0.15s ease, transform 0.15s ease;
    }

    /* Risposta immediata al tocco su touch-screen */
    li:active {
        transform: scale(0.98);
        border-color: var(--card-hover-border);
    }

    /* Effetto passaggio del mouse (solo per desktop con cursore reale) */
    @media (hover: hover) {
        li:hover {
            border-color: var(--card-hover-border);
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-1px);
        }

        li:hover::after {
            color: var(--primary);
            transform: translate(2px, -2px);
        }
    }

    .card-title {
        margin: 0 0 4px;
    }

    .card-title a {
        color: var(--primary);
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.3px;
    }

    .card-title a::after {
        content: "";
        position: absolute;
        inset: 0;
    }

    .description {
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 400;
        line-height: 1.5;
    }

    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
    }

    .tag {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2px;
        padding: 2px 8px;
        border-radius: 4px;
        background: var(--accent-bg);
        color: var(--primary-light);
    }

    .error {
        color: #c94a4a;
    }

    @media (max-width: 600px) {
        body {
            padding: 40px 18px 60px;
        }

        h1 {
            font-size: 25px;
        }

        li {
            padding: 18px 42px 18px 18px;
        }
    }
</style>
</head>

<body>

<main>
    <header>
        <div class="top-bar">
            <h1>Tagt The Spellcaster</h1>
            <div class="theme-selector">
                <span class="theme-option" id="optLight">Light Mode</span>
                <span class="theme-separator">|</span>
                <span class="theme-option" id="optDark">Dark Mode</span>
            </div>
        </div>
        <p class="subtitle">
            Progetti, utility e strumenti pubblicati su GitHub Pages
        </p>
    </header>

    <div class="section-header">
        <div id="status">Ricerca dei progetti...</div>
    </div>

    <ul id="projects"></ul>
</main>

<script>
let allProjects = [];

const optLight = document.getElementById('optLight');
const optDark = document.getElementById('optDark');

function getEffectiveTheme() {
    const saved = localStorage.getItem('theme');
    if (saved) return saved;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);

    if (theme === 'dark') {
        optDark.classList.add('active');
        optLight.classList.remove('active');
    } else {
        optLight.classList.add('active');
        optDark.classList.remove('active');
    }
}

optLight.addEventListener('click', () => applyTheme('light'));
optDark.addEventListener('click', () => applyTheme('dark'));

applyTheme(getEffectiveTheme());

async function loadProjects() {
    const status = document.getElementById("status");

    try {
        const cacheBuster = new Date().getTime();
        const response = await fetch(`./repositories.json?v=${cacheBuster}`);
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        
        if (Array.isArray(data)) {
            allProjects = data;
        } else if (data && Array.isArray(data.projects)) {
            allProjects = data.projects;
        } else {
            allProjects = [];
        }

        renderProjects(allProjects);
    } catch (error) {
        status.textContent = "Impossibile recuperare l'elenco dei progetti.";
        status.className = "error";
        console.error("Errore durante il caricamento dei progetti:", error);
    }
}

function renderProjects(projects) {
    const status = document.getElementById("status");
    const list = document.getElementById("projects");
    list.innerHTML = "";

    if (projects.length === 0) {
        status.textContent = "Nessun progetto trovato.";
        return;
    }

    status.textContent = `${projects.length} programm${projects.length === 1 ? 'o' : 'i'} pubblicat${projects.length === 1 ? 'o' : 'i'}`;

    for (const project of projects) {
        const li = document.createElement("li");

        const title = document.createElement("div");
        title.className = "card-title";

        const link = document.createElement("a");
        link.href = project.url || "#";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = project.name || "Senza nome";
        title.appendChild(link);
        li.appendChild(title);

        if (project.description) {
            const description = document.createElement("div");
            description.className = "description";
            description.textContent = project.description;
            li.appendChild(description);
        }

        if (project.tags && Array.isArray(project.tags) && project.tags.length > 0) {
            const tagsContainer = document.createElement("div");
            tagsContainer.className = "tags";
            project.tags.forEach(tagText => {
                const tag = document.createElement("span");
                tag.className = "tag";
                tag.textContent = tagText;
                tagsContainer.appendChild(tag);
            });
            li.appendChild(tagsContainer);
        }

        list.appendChild(li);
    }
}

loadProjects();
</script>

</body>
</html>
