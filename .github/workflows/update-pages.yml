name: Aggiorna elenco GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Genera repositories.json
        env:
          OWNER: TagtTheSpellCaster
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from urllib.parse import quote

          OWNER = os.environ["OWNER"]

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "github-pages-index"
                  }
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          repos = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/users/{OWNER}/repos"
                  f"?type=public&per_page=100&page={page}"
              )

              data = get_json(url)

              if not data:
                  break

              repos.extend(data)

              if len(data) < 100:
                  break

              page += 1

          projects = []

          for repo in repos:
              name = repo["name"]

              # Non includiamo il repository che contiene questa pagina.
              if name.lower() == f"{OWNER}.github.io".lower():
                  continue

              if not repo.get("has_pages", False):
                  continue

              # URL standard di GitHub Pages.
              pages_url = (
                  f"https://{OWNER.lower()}.github.io/"
                  f"{quote(name)}"
              )

              projects.append({
                  "name": name,
                  "url": pages_url,
                  "description": repo.get("description") or "",
                  "repository": repo["html_url"]
              })

          projects.sort(key=lambda project: project["name"].lower())

          output = {
              "projects": projects
          }

          with open("repositories.json", "w", encoding="utf-8") as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Trovati {len(projects)} repository con GitHub Pages.")
          for project in projects:
              print(f"- {project['name']}: {project['url']}")
          PY

      - name: Salva le modifiche
        run: |
          git add repositories.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Aggiorna elenco GitHub Pages"
          git push
